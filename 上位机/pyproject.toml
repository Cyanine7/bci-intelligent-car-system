[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-host-workbench"
version = "0.5.0"
description = "小车串口与蓝牙SPP通信、监测及可扩展调试工作台"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6==6.11.0",
    "numpy==2.4.6",
    "pyqtgraph==0.14.0",
    "pyserial==3.5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["car_host*", "car_debug_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
